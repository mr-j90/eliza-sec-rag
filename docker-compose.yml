services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: sec-rag-qdrant
    ports:
      - "6533:6333" # REST
      - "6534:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # /readyz rather than /healthz: this must not report ready before it can serve.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  qdrant_storage:

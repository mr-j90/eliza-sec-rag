[project]
name = "rag"
version = "0.1.0"
description = "Hybrid RAG over SEC EDGAR filings — design in SPEC.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
